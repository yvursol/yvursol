<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="150" viewBox="0 0 1280 150" role="img" aria-labelledby="t d" fill="none">
<title id="t">By the numbers</title><desc id="d">50+ virtual machines in my care; 2022 running production infra since; 24/7 monitoring with Zabbix &amp; Grafana; 105 tests in my backup toolkit</desc>
<style>@media (prefers-reduced-motion: reduce){*{animation:none!important}}.sh{animation:sh 5s ease-in-out infinite}@keyframes sh{0%{transform:translateX(-120px)}60%,100%{transform:translateX(420px)}}@keyframes in0{0%{opacity:0;transform:translateY(10px)}100%{opacity:1;transform:none}}.in0{animation:in0 .7s 0.00s ease-out both}@keyframes in1{0%{opacity:0;transform:translateY(10px)}100%{opacity:1;transform:none}}.in1{animation:in1 .7s 0.15s ease-out both}@keyframes in2{0%{opacity:0;transform:translateY(10px)}100%{opacity:1;transform:none}}.in2{animation:in2 .7s 0.30s ease-out both}@keyframes in3{0%{opacity:0;transform:translateY(10px)}100%{opacity:1;transform:none}}.in3{animation:in3 .7s 0.45s ease-out both}</style><defs><linearGradient id="shine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0"/><stop offset=".5" stop-color="#ffffff" stop-opacity=".9"/>
